<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qdrant RAG Chat</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --surface: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --radius: 10px;
            --shadow: 0 1px 2px rgb(15 23 42 / 0.04), 0 4px 12px rgb(15 23 42 / 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-size: 14px;
        }

        /* --- Cabecalho --- */
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
        }

        .app-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .app-header h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .app-header p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- Layout --- */
        .app-main {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px 24px;
            min-height: 0;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .config-panel {
            flex: 0 0 360px;
            overflow-y: auto;
        }

        .chat-panel {
            flex: 1;
            min-width: 0;
        }

        .panel-section {
            padding: 20px 22px;
        }

        .panel-section + .panel-section {
            border-top: 1px solid var(--border);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            margin: 0 0 4px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .section-desc {
            margin: 0 0 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .panel-header h2 {
            margin: 0;
        }

        /* --- Formularios --- */
        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row > * {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-main);
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15);
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed var(--border-strong);
            border-radius: 7px;
            background: var(--surface);
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 6px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: #fff;
            color: var(--text-main);
            font-family: inherit;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            color: var(--text-main);
            cursor: pointer;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.15s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .inline-field {
            display: flex;
            gap: 8px;
        }

        .inline-field button {
            width: auto;
        }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            display: none;
        }

        .success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
            display: block;
        }

        .error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
            display: block;
        }

        /* --- Chat --- */
        .collection-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collection-picker label {
            margin: 0;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .collection-picker input {
            width: 220px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: white;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 14px 22px;
            border-top: 1px solid var(--border);
            background: var(--panel-bg);
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 11px 14px;
        }

        .chat-input-area button {
            width: auto;
            padding: 0 22px;
        }

        /* --- Responsivo --- */
        @media (max-width: 860px) {
            body {
                height: auto;
                min-height: 100vh;
            }

            .app-main {
                flex-direction: column;
                padding: 16px;
            }

            .config-panel {
                flex: none;
            }

            .chat-panel {
                height: 75vh;
            }

            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .collection-picker input {
                width: 100%;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="app-logo">Q</div>
        <div>
            <h1>Qdrant RAG Chat</h1>
            <p>Gerencie coleções, ingira documentos e consulte sua base</p>
        </div>
    </header>

    <main class="app-main">

        <!-- Panel 1: Configuration & Upload -->
        <aside class="panel config-panel">
            <section class="panel-section">
                <h2>Coleções Qdrant</h2>
                <p class="section-desc">Crie uma nova coleção para armazenar os embeddings.</p>

                <div class="form-group">
                    <label for="newCollectionName">Nome da coleção</label>
                    <div class="inline-field">
                        <input type="text" id="newCollectionName" placeholder="ex: base_teste">
                        <button onclick="createCollection()">Criar</button>
                    </div>
                    <div id="colStatus" class="status-msg"></div>
                </div>
            </section>

            <section class="panel-section">
                <h2>Ingestão de Arquivo</h2>
                <p class="section-desc">Envie um PDF ou TXT para ser dividido em chunks e vetorizado.</p>

                <form id="uploadForm" onsubmit="uploadDocument(event)">
                    <div class="form-group">
                        <label for="uploadCollection">Coleção de destino</label>
                        <input type="text" id="uploadCollection" required placeholder="Nome da coleção existente">
                    </div>

                    <div class="form-group">
                        <label for="fileInput">Arquivo (PDF/TXT)</label>
                        <input type="file" id="fileInput" required accept=".pdf,.txt">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="chunkSize">Chunk size</label>
                            <input type="number" id="chunkSize" value="1000" min="100">
                        </div>
                        <div class="form-group">
                            <label for="overlap">Overlap</label>
                            <input type="number" id="overlap" value="100" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="splitterType">Splitter</label>
                        <select id="splitterType">
                            <option value="recursive">Recursive Character</option>
                            <option value="character">Character</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="useTiktoken"> Usar Tiktoken
                        </label>
                    </div>

                    <button type="submit" id="btnUpload">Processar e Ingerir</button>
                    <div id="uploadStatus" class="status-msg"></div>
                </form>
            </section>
        </aside>

        <!-- Panel 2: Chat -->
        <section class="panel chat-panel">
            <div class="panel-header">
                <h2>Chat RAG</h2>
                <div class="collection-picker">
                    <label for="chatCollection">Coleção</label>
                    <input type="text" id="chatCollection" value="Fiscap_Edital_v1">
                </div>
            </div>

            <div class="chat-history" id="chatHistory">
                <div class="message bot-message">Olá! Qual a sua dúvida sobre os documentos da sua base?</div>
            </div>

            <form class="chat-input-area" onsubmit="sendMessage(event)">
                <input type="text" id="chatInput" placeholder="Digite sua pergunta..." autocomplete="off" required>
                <button type="submit" id="btnSend">Enviar</button>
            </form>
        </section>

    </main>

    <script>
        const API_BASE = 'http://localhost:8000';

        // Historico em memoria
        let chatContext = [];

        // --- Qdrant Colecoes ---
        async function createCollection() {
            const name = document.getElementById('newCollectionName').value.trim();
            const statusDiv = document.getElementById('colStatus');

            if (!name) return;

            try {
                // Notando que o router de collections atual da aplicacao do usuario tem o prefixo /collections ou /qdrant/collection
                // Seguindo file qdrant.py = router.post("/collection") -> prefixo "/qdrant" = "/qdrant/collection"
                // Pelo teste recente do usuario estava "POST /qdrant/collection?collection_name=teste"
                const res = await fetch(`${API_BASE}/qdrant/collection?collection_name=${encodeURIComponent(name)}`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (res.ok) {
                    statusDiv.className = 'status-msg success';
                    statusDiv.textContent = data.message || `Coleção ${name} criada com sucesso.`;
                    document.getElementById('uploadCollection').value = name;
                    document.getElementById('chatCollection').value = name;
                } else {
                    statusDiv.className = 'status-msg error';
                    statusDiv.textContent = data.detail || 'Erro ao criar coleção.';
                }
            } catch (err) {
                statusDiv.className = 'status-msg error';
                statusDiv.innerHTML = 'Erro de conexão.';
            }
        }

        // --- Qdrant Ingestao ---
        async function uploadDocument(e) {
            e.preventDefault();

            const colName = document.getElementById('uploadCollection').value.trim();
            const fileInput = document.getElementById('fileInput').files[0];
            const chunkSize = document.getElementById('chunkSize').value;
            const overlap = document.getElementById('overlap').value;
            const splitter = document.getElementById('splitterType').value;
            const tiktoken = document.getElementById('useTiktoken').checked;
            const statusDiv = document.getElementById('uploadStatus');
            const btn = document.getElementById('btnUpload');

            if (!colName || !fileInput) return;

            btn.disabled = true;
            btn.innerHTML = 'Processando (LLM + Embeddings)...';
            statusDiv.className = 'status-msg';

            const formData = new FormData();
            formData.append("files", fileInput);
            formData.append("chunk_size", chunkSize);
            formData.append("overlap_chunk", overlap);
            formData.append("splitter_type", splitter);
            formData.append("use_tiktoken", tiktoken);

            try {
                // Utilizando router /qdrant/collection/{collection_name}/document
                const res = await fetch(`${API_BASE}/qdrant/collection/${encodeURIComponent(colName)}/document`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    // O endpoint retorna um resultado por arquivo em data.results
                    const result = (data.results || [])[0] || {};
                    if (result.status === 'success') {
                        statusDiv.className = 'status-msg success';
                        statusDiv.textContent = `Vetorizado! ${result.vector_count} chunks processados.`;
                    } else {
                        statusDiv.className = 'status-msg error';
                        statusDiv.textContent = result.message || 'Erro na ingestão.';
                    }
                } else {
                    // Erros de validacao (422) trazem detail como lista
                    const detail = Array.isArray(data.detail)
                        ? data.detail.map(d => d.msg).join('; ')
                        : data.detail;
                    statusDiv.className = 'status-msg error';
                    statusDiv.textContent = detail || 'Erro na ingestão.';
                }
            } catch (err) {
                statusDiv.className = 'status-msg error';
                statusDiv.innerHTML = 'Falha na requisição.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Processar e Ingerir';
            }
        }

        // --- Chat UI ---
        function appendMessage(text, isUser) {
            const historyObj = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;

            // textContent evita que o conteudo seja interpretado como HTML;
            // white-space: pre-wrap (no CSS) preserva as quebras de linha
            msgDiv.textContent = text;
            historyObj.appendChild(msgDiv);
            historyObj.scrollTop = historyObj.scrollHeight;
        }

        // --- Chat Requisicao ---
        async function sendMessage(e) {
            e.preventDefault();

            const inputField = document.getElementById('chatInput');
            const query = inputField.value.trim();
            const collectionName = document.getElementById('chatCollection').value.trim();
            const btn = document.getElementById('btnSend');

            if (!query) return;

            appendMessage(query, true);
            inputField.value = '';
            btn.disabled = true;

            const formData = new FormData();
            formData.append("query", query);
            formData.append("collection_name", collectionName);
            if (chatContext.length > 0) {
                formData.append("history", JSON.stringify(chatContext));
            }

            try {
                // Endpoint /chat/ask espera FormData
                const res = await fetch(`${API_BASE}/chat/ask`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    appendMessage(data.response, false);

                    // Adiciona no history basico
                    chatContext.push({ "role": "user", "content": query });
                    chatContext.push({ "role": "assistant", "content": data.response });
                } else {
                    const errInfo = await res.json();
                    appendMessage(`[Erro do servidor: ${errInfo.detail || res.status}]`, false);
                }
            } catch (err) {
                appendMessage(`[Falha ao conectar com ${API_BASE}]`, false);
            } finally {
                btn.disabled = false;
                inputField.focus();
            }
        }
    </script>
</body>

</html>
